<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="color-scheme" content="dark" />
  <title>ARK Overlay</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="top">
    <h1>ARK<span>Overlay</span></h1>
    <nav id="tabs" class="tabs">
      <button type="button" class="tab on" data-tab="timer">タイマー</button>
      <button type="button" class="tab" data-tab="dex" id="tabDex" hidden>図鑑</button>
      <button type="button" class="tab" data-tab="items" id="tabItems" hidden>アイテム</button>
    </nav>
    <button type="button" id="updateReady" class="update-btn" hidden></button>
    <button type="button" id="openSettings" class="gear" title="設定">⚙</button>
    <div id="winCtl" class="win-ctl" hidden>
      <button type="button" id="winPin" class="on" title="常に手前に表示">前面</button>
      <button type="button" id="winMin" title="最小化">−</button>
      <button type="button" id="winHide" title="トレイにしまう">×</button>
    </div>
  </header>

  <main>
    <div data-panel="timer">
      <form id="form" class="card" autocomplete="off">
        <label class="field">
          <span>名前</span>
          <input id="name" type="text" placeholder="例：ルミナ孵化" maxlength="40" enterkeyhint="done" />
        </label>
        <div class="time">
          <label><input id="h" type="number" inputmode="numeric" min="0" max="999" placeholder="0" /><span>時間</span></label>
          <label><input id="m" type="number" inputmode="numeric" min="0" max="59" placeholder="0" /><span>分</span></label>
          <label><input id="s" type="number" inputmode="numeric" min="0" max="59" placeholder="0" /><span>秒</span></label>
        </div>
        <p id="formError" class="error" hidden></p>
        <div class="actions">
          <button type="button" id="savePreset">プリセット保存</button>
          <button type="submit" class="primary">開始</button>
        </div>
      </form>

      <section>
        <div class="section-head">
          <h2>プリセット</h2>
          <button id="editPresets" class="link" type="button">編集</button>
        </div>
        <div id="presets" class="chips"></div>
      </section>

      <section>
        <div class="section-head">
          <h2>タイマー <span id="timerCount" class="count"></span></h2>
        </div>
        <div id="timers" class="timers"></div>
      </section>
    </div>

    <div data-panel="dex" hidden>
      <section class="dex">
        <div class="section-head">
          <h2>図鑑 <span id="dexCount" class="count"></span></h2>
          <button id="editRates" class="link" type="button">サーバー倍率</button>
        </div>
        <div id="rates" class="card" hidden></div>
        <div class="card">
          <label class="field">
            <span>生物を探す</span>
            <input id="creatureQuery" type="text" placeholder="例：ティラノサウルス / Rex" maxlength="40" autocomplete="off" />
          </label>
        </div>
        <div id="creatureResults" class="dex-list"></div>
        <div id="creatureDetail"></div>
      </section>
    </div>

    <div data-panel="items" hidden>
      <section>
        <div class="section-head">
          <h2>アイテム <span id="itemCount" class="count"></span></h2>
        </div>
        <div class="card">
          <label class="field">
            <span>アイテムを探す</span>
            <input id="itemQuery" type="text" placeholder="例：生肉 / キブル / Raw" maxlength="40" autocomplete="off" />
          </label>
          <div id="itemMode" class="mode">
            <span>選んだものの扱い</span>
            <button type="button" class="on" data-mode="pick">対象</button>
            <button type="button" data-mode="exclude">非対象</button>
          </div>
          <div class="mode">
            <span>品質（名前の頭に付く語）</span>
            <select id="itemQuality">
              <option value="">指定なし</option>
              <option value="Primitive">Primitive（原始的な）</option>
              <option value="Ramshackle">Ramshackle（がたがたの）</option>
              <option value="Apprentice">Apprentice（職人見習いの）</option>
              <option value="Journeyman">Journeyman（職人の）</option>
              <option value="Mastercraft">Mastercraft（名工の）</option>
              <option value="Ascendant">Ascendant（至高の）</option>
            </select>
          </div>
        </div>
        <div id="itemPicked"></div>
        <div id="itemResults" class="dex-list"></div>
      </section>
    </div>

    <div data-panel="settings" hidden>
      <section>
        <div class="section-head">
          <h2>設定</h2>
        </div>
        <div class="card settings">
          <div class="set-row">
            <label for="setTransparency">背景の透過率</label>
            <output id="setTransparencyValue" for="setTransparency"></output>
          </div>
          <input id="setTransparency" type="range" min="10" max="100" step="5" />
          <p class="hint">100% で背景が無くなり、ゲーム画面がそのまま透ける。文字を載せる面の濃さは変わらない</p>
        </div>
        <div id="setWindow" class="card settings" hidden>
          <div id="setClickThrough" class="mode">
            <span>クリック</span>
            <button type="button" data-through="false">受ける</button>
            <button type="button" data-through="true">透過する</button>
          </div>
          <p class="hint">透過すると、窓の上をクリックしても下のゲームに届く。上部のバー（タブや ⚙ の並び）だけは押せるので、ここから戻せる。トレイメニューからも切り替えられる</p>
          <div class="set-row">
            <label for="setShortcut">透過を切り替えるキー</label>
          </div>
          <div class="shortcut">
            <input id="setShortcut" type="text" readonly placeholder="なし" />
            <button type="button" id="clearShortcut">なし</button>
          </div>
          <p id="shortcutMsg" class="hint">欄を押してから、使いたい組み合わせを押す（Ctrl・Alt のどちらかと一緒に）。ゲームを操作している最中でも効く</p>
        </div>
      </section>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
