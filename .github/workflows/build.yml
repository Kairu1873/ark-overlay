name: Build

# main への push では動かさない（明示的に実行したときとタグ push のときだけ）
on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  windows:
    name: Windows インストーラー
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: ARKOverlay-Windows
          path: dist/*.exe
          if-no-files-found: error

  release:
    name: リリース作成（タグ v* をpushしたとき）
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
