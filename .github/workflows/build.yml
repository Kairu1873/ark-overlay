name: Build

# main への push では動かさない（Private リポジトリの Actions 枠を節約するため）
on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  windows:
    name: Windows インストーラー
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: ARKTimer-Windows
          path: dist/*.exe
          if-no-files-found: error

  ios:
    name: iOS（署名なしIPA）
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Electron本体はiOSビルドに不要なのでダウンロードしない
      - run: npm ci --ignore-scripts
      - run: npm run sync:ios
      - name: Xcodeでビルド（署名なし）
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/ios \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build
      - name: IPAにまとめる
        run: |
          mkdir -p out/Payload
          cp -R build/ios/Build/Products/Release-iphoneos/App.app out/Payload/
          cd out && zip -qry ARKTimer-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: ARKTimer-iOS-unsigned
          path: out/ARKTimer-unsigned.ipa
          if-no-files-found: error

  release:
    name: リリース作成（タグ v* をpushしたとき）
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
